[package]
name = "ech-request"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "ech_request"

[dependencies]
rustls = "0.23.40"
hickory-resolver = { version = "0.26.1", features = ["https-aws-lc-rs"]}
webpki-roots = "1.0.8"
jni = "0.22.4"
tokio = { version = "1.52.3", features = ["full"] }
once_cell = "1.21"